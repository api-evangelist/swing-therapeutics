aid: swing-therapeutics
name: Swing Therapeutics
description: >-
  Swing Therapeutics is a San Francisco digital therapeutics company founded in 2019 that develops
  evidence-based, smartphone-delivered treatments for chronic illness. Its lead product, Stanza, is a
  12-week prescription digital therapeutic delivering Acceptance and Commitment Therapy (ACT) for the
  management of fibromyalgia symptoms in adults, and in 2023 it became the first digital therapeutic to
  receive FDA De Novo marketing authorization for that indication. Stanza is prescribed by clinicians and
  dispensed to patients as a native iOS/Android application; the company also operates Swing Care, a
  virtual fibromyalgia clinic offering physician visits, medication management and coaching. Swing
  Therapeutics and Swing Care were acquired by XRHealth in July 2026. The company publishes no public API,
  developer portal, SDK or machine-readable specification — its software is delivered exclusively as a
  regulated end-user therapy, and it is an API consumer (its clinical operations run on the Healthie
  EHR API) rather than an API provider.
